[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
test = 'test'
evm_version = 'paris'
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    '@openzeppelin/=lib/openzeppelin-contracts/',
    '@openzeppelin-upgradeable/=lib/openzeppelin-contracts-upgradeable/',
    '@forta-staking/=lib/forta-contracts/contracts/components/staking/',
    'forge-std/=lib/forge-std/src/'
]

[fmt]
line_length = 120
tab_width = 4
