[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
test = 'test'
evm_version = 'cancun'
fs_permissions = [{ access = "read", path = "./"}]

[fmt]
line_length = 120
tab_width = 4

[rpc_endpoints]
# Official RPC may be down after chain halt; prefer public archive-capable endpoints
cronos = "https://cronos.drpc.org"
