[profile.default]
src = 'src/connext'
out = 'out'
libs = ['lib']
test = 'test'
evm_version = 'paris'
optimizer = true
optimizer_runs = 200
# Deterministic, metadata-free runtime so the 36KB ConnextPortalHarness can be injected
# byte-for-byte into anvil_state.json (browser Playground) and aliased to its source.
bytecode_hash = 'none'
cbor_metadata = false
remappings = [
  '@openzeppelin/contracts/=lib/openzeppelin-contracts/',
  '@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/'
]

[fmt]
line_length = 120
tab_width = 4
