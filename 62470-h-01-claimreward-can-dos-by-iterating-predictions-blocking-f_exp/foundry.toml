[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
test = 'test'
solc = '0.8.27'
evm_version = 'cancun'
via_ir = false
optimizer = true
optimizer_runs = 200
# The PoC floods a round with ~25k predictions to drive claimReward past the
# block gas limit; raise the test gas budget above Foundry's 2^30 default.
gas_limit = "18446744073709551615"

[fmt]
line_length = 120
tab_width = 4
