[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
test = 'test'
evm_version = 'istanbul'
optimizer = true
optimizer_runs = 200
remappings = [
    '@openzeppelin/contracts/=lib/openzeppelin/contracts/',
    '@openzeppelin/upgrades/=lib/openzeppelin/upgrades/'
]

[fmt]
line_length = 120
tab_width = 4
