[profile.default]
src = 'src/src/v2/Carousel'
out = 'out'
libs = ['lib']
test = 'test'
evm_version = 'cancun'
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "@solmate/=lib/solmate/src/"
]

[fmt]
line_length = 120
tab_width = 4
