[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
test = 'test'
evm_version = 'cancun'
fs_permissions = [{ access = "read", path = "./"}]
solc = '0.8.25'
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 120
tab_width = 4

[rpc_endpoints]
# Infura 402 — use archive-capable public endpoint for fork @ 25798653
mainnet = "https://eth.drpc.org"
