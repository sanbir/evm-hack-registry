[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
test = 'test'
solc = '0.8.20'
evm_version = 'paris'
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts-v4/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts-v4/contracts/",
]

[fmt]
line_length = 120
tab_width = 4
