[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
test = 'test'
solc = '0.8.24'
evm_version = 'paris'
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = 'none'
remappings = [
  'forge-std/=lib/forge-std/src/',
  '@openzeppelin/contracts/=lib/openzeppelin-contracts/',
  '@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/',
  '@nomad-xyz/excessively-safe-call/=src/external/excessively-safe-call/',
  '@matterlabs/zksync-contracts/=src/external/zksync/'
]

[fmt]
line_length = 120
tab_width = 2
