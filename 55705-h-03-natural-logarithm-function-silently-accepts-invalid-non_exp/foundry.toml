[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
test = 'test'
solc = '0.8.24'
evm_version = 'cancun'
optimizer = true
optimizer_runs = 200
via_ir = false
# Strip trailing metadata so Ln's runtime is deterministic and metadata-free — the same
# bytes are vm.etch()ed by the registry test AND injected into anvil_state.json for the
# in-browser Playground replay.
bytecode_hash = 'none'
cbor_metadata = false
# Ln is a library with `public` functions, so it is linked (delegatecalled), not inlined.
# Pin it at a fixed address: the registry test vm.etch()es Ln's runtime there, and the
# Playground injects the same runtime into anvil_state.json at this address. 0x6c6e = "ln".
libraries = ['src/Ln.sol:Ln:0x0000000000000000000000000000000000006c6e']

[fmt]
line_length = 120
tab_width = 4
